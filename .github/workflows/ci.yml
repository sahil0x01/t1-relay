name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://relay:relay@localhost:5432/relay_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Check migrations are up to date
        run: |
          pnpm --filter @relay/db db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "The schema changed without a migration."
            echo "Run: pnpm --filter @relay/db db:generate, then commit packages/db/drizzle."
            git status --short packages/db/drizzle
            exit 1
          fi
      - run: pnpm test
